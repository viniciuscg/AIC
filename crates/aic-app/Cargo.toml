[package]
name = "aic-app"
description = "AIC — central de vibecode pessoal"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "aic"
path = "src/main.rs"

[lib]
name = "aic_app"
path = "src/lib.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
image.workspace = true
