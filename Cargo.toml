[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Vinicius Gonçalves"]

[workspace.dependencies]
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
egui_extras = { version = "0.36", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
alacritty_terminal = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
notify-rust = "4"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

aic-term = { path = "crates/aic-term" }
aic-core = { path = "crates/aic-core" }

[profile.release]
lto = "thin"
codegen-units = 4
