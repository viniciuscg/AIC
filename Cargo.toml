[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "MIT"
authors = ["Vinicius Gonçalves"]

[workspace.dependencies]
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "persistence"] }
image = { version = "0.25", default-features = false, features = ["png"] }
alacritty_terminal = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
rusqlite = { version = "0.40", features = ["bundled"] }
notify-rust = "4"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

aic-term = { path = "crates/aic-term" }
aic-core = { path = "crates/aic-core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# egui-winit com um ajuste: Ctrl+V com imagem no clipboard (sem texto) vira tecla normal
# em vez de sumir, pra o Claude Code receber o Ctrl+V e colar a imagem. Ver vendor/egui-winit/AIC.md.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }
